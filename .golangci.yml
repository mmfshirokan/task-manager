version: "2"

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - funlen
    - govet
    - grouper
    - importas
    - ineffassign
    - ireturn
    - nestif
    - nlreturn
    - staticcheck
    - unused
    - wsl_v5

  settings:
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/go-chi/chi/v5/middleware
          alias: chimiddleware
        - pkg: github.com/golang-jwt/jwt/v5
          alias: jwt

    grouper:
      import-require-grouping: true

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - funlen
